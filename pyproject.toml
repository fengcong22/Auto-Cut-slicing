[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cut-slicing"
version = "0.2.0"
description = "Independent video slicing, concatenation and transcript-guided ripple editing"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.scripts]
auto-cut-slicing = "auto_cut_slicing.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["auto_cut_slicing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
